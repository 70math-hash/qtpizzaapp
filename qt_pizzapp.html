*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
button,input,.stp,.sg-b,.it-m,.it-a{touch-action:manipulation}
:root{
  --dark:#1A1E1E;--mid:#A0A5A5;--cream:#E5E2DE;--white:#EFECEC;--frame:#C9C5C0;
  --bg:#EFECEC;--fg:#1A1E1E;--inv:#1A1E1E;--invFg:#EFECEC;
  --hair:rgba(128,128,128,.35);--hair2:rgba(128,128,128,.3);--hair3:rgba(128,128,128,.22);
  --green:#5A7D62;--red:#A85F42;
  --ex:'HelvEx','Helvetica Neue',Helvetica,Arial,sans-serif;
  --ui:'Inter',system-ui,-apple-system,sans-serif;
}
html[data-theme="dark"]{--bg:#1A1E1E;--fg:#EFECEC;--inv:#EFECEC;--invFg:#1A1E1E}
html,body{height:100%}
body{background:var(--frame);font-family:var(--ui);color:var(--fg);font-size:15px;line-height:1.5;overflow:hidden}
.app{display:flex;flex-direction:column;height:100dvh;max-width:440px;margin:0 auto;background:var(--bg)}
.ex{font-family:var(--ex);font-weight:400}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font-family:inherit;color:inherit;background:none;border:none;outline:none}

/* HEADER */
.hd{flex:none;display:flex;align-items:center;gap:10px;padding:10px 22px 15px}
.hd-btn{width:36px;height:36px;flex:none;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:300;position:relative}
.hd-btn::after,.hd-th::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px}
.hd-th{width:36px;height:36px;flex:none;border:1px solid var(--hair);font-size:9px;letter-spacing:.1em;display:flex;align-items:center;justify-content:center;position:relative}
.hd-mid{flex:1;min-width:0;text-align:center}
.hd-t{font-family:var(--ex);font-size:11px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-s{font-size:10px;font-weight:200;font-style:italic;color:var(--mid);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* STEPS */
.steps{flex:none;display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--hair2);border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.stp{padding:11px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:5px;min-height:44px;background:var(--bg);color:var(--mid)}
.stp.on{background:var(--inv);color:var(--invFg)}
.stp-n{font-family:var(--ex);font-size:12px;letter-spacing:.04em}
.stp-l{font-size:8px;letter-spacing:.2em;text-transform:uppercase;font-weight:300}

/* CONTENT */
.ct>*{flex:none}
.ct{flex:1;overflow-y:auto;overflow-x:hidden;padding:26px 22px 34px;display:flex;flex-direction:column;gap:24px;-webkit-overflow-scrolling:touch;text-wrap:pretty}
.ttl{font-family:var(--ex);font-size:32px;line-height:1.05;letter-spacing:-.012em}
.ttl-s{font-size:15px;font-weight:200;font-style:italic;color:var(--mid);line-height:1.4;margin-top:6px}
.disp{font-family:var(--ex);font-size:30px;line-height:1.05;letter-spacing:-.012em}
/* CABEÇALHO DE SEÇÃO — overline · display · itálico · fio */
.sec{display:flex;flex-direction:column}
.sec-d{font-family:var(--ex);font-size:30px;line-height:1.05;letter-spacing:-.012em}
.ov+.sec-d{margin-top:9px}
.sec-s{font-size:15px;font-weight:200;font-style:italic;color:var(--mid);line-height:1.4;margin-top:5px}
.sec-h{height:1px;background:var(--hair);margin-top:21px}
.ov{font-size:9px;font-weight:300;letter-spacing:.32em;text-transform:uppercase;color:var(--mid)}
.hair{height:1px;background:var(--hair)}
.dica{font-size:12.5px;font-weight:200;font-style:italic;color:var(--mid);line-height:1.8;border-left:1px solid var(--hair);padding-left:14px}
.blk{display:flex;flex-direction:column;gap:12px}

/* STEPPER */
.st{display:grid;grid-template-columns:56px 1fr 56px;height:58px;border:1px solid var(--hair)}
.st-b{font-size:19px;font-weight:300;display:flex;align-items:center;justify-content:center;min-height:44px}
.st-b:first-child{border-right:1px solid var(--hair)}
.st-b:last-child{border-left:1px solid var(--hair)}
.st-v{display:flex;flex-wrap:wrap;align-content:center;align-items:baseline;justify-content:center;gap:5px;padding:0 4px;overflow:hidden}
.st-n{font-family:var(--ex);font-size:26px}
.st-i{text-align:center;min-width:1.6em;max-width:100%;padding:0;border:none;background:none;-webkit-appearance:none;appearance:none;border-bottom:1px solid transparent}
.st-i:focus{border-bottom-color:var(--hair)}
.st-i::-webkit-outer-spin-button,.st-i::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.st-u{font-size:9px;letter-spacing:.2em;text-transform:uppercase;font-weight:300;opacity:.5}
.st-lb{font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:300;color:var(--mid);margin-bottom:6px}
.st.sm{grid-template-columns:38px 1fr 38px;height:50px}
.st.sm .st-n{font-size:19px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* SEGMENTED */
.sg{display:grid;gap:1px;border:1px solid var(--hair);background:var(--hair)}
.sg-b{padding:14px 4px;min-height:44px;font-size:9px;letter-spacing:.16em;text-transform:uppercase;font-weight:400;background:var(--bg);color:var(--mid)}
.sg-b.on{background:var(--inv);color:var(--invFg)}

/* ROWS / GRID OUT */
.rw{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-bottom:9px;border-bottom:1px solid var(--hair3)}
.rw:last-child{border-bottom:none;padding-bottom:0}
.rw-k{font-size:12.5px;font-weight:300;color:var(--mid)}
.rw-v{font-family:var(--ex);font-size:14px;text-align:right}
.og{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--hair2);border:1px solid var(--hair)}
.oc{background:var(--bg);padding:17px 16px 16px}
.oc-n{font-family:var(--ex);font-size:26px;letter-spacing:-.01em}
.oc-u{font-size:9px;opacity:.45;margin-left:2px}
.oc-l{font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;font-weight:300;color:var(--mid);margin-top:6px}

/* LIST ITEM */
.it{display:flex;align-items:stretch;border:1px solid var(--hair)}
.it-x{width:44px;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--ex);font-size:12px;color:var(--mid);border-right:1px solid var(--hair)}
.it-m{flex:1;min-width:0;padding:15px 16px;text-align:left}
.it-n{font-family:var(--ex);font-size:15px}
.it-d{font-size:11px;font-weight:300;color:var(--mid);margin-top:5px;line-height:1.5}
.it-a{width:46px;flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:300;color:var(--mid)}
.it-a.bd{border-left:1px solid var(--hair)}

/* RULER */
.rl{position:relative;height:1px;background:var(--hair);margin:16px 0 8px}
.rl-m{position:absolute;top:-5px;width:1px;height:11px;background:currentColor}
.rl-s{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.16em;color:var(--mid);font-weight:300}

/* DOSE BOX */
.dz{border:1px solid var(--hair);padding:16px 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:14px}
.dz-s{font-size:11.5px;font-weight:200;font-style:italic;color:var(--mid);margin-top:6px}
.dz-n{font-family:var(--ex);font-size:32px;letter-spacing:-.01em;white-space:nowrap}
.dz-u{font-size:10px;opacity:.5;margin-left:2px}

/* FOOTER */
.ft{flex:none;background:var(--inv);color:var(--invFg)}
.ft-g{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--hair)}
.ft-c{background:var(--inv);padding:15px 12px 14px}
.ft-n{font-family:var(--ex);font-size:20px;letter-spacing:-.01em}
.ft-l{font-size:7.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:300;color:var(--mid);margin-top:5px}
.ft-b{border-top:1px solid var(--hair);padding:13px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.ft-t{font-size:12px;font-weight:200;font-style:italic;color:var(--mid);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ft-x{background:var(--bg);color:var(--fg);padding:13px 22px;min-height:44px;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:400;flex:none}
.lib-ft{display:grid;grid-template-columns:1fr;gap:1px;background:var(--hair);border-top:1px solid var(--hair)}
.lib-b{padding:19px;min-height:44px;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:400;background:var(--bg);color:var(--fg)}
.lib-b.inv{background:var(--inv);color:var(--invFg)}

/* ACTIONS */
.ac{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ac-b{padding:16px;min-height:44px;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:400;border:1px solid var(--hair)}
.ac-b.inv{background:var(--inv);color:var(--invFg);border-color:var(--inv)}
.nm{width:100%;height:52px;border:1px solid var(--hair);padding:0 16px;font-family:var(--ex);font-size:16px}
.nm:focus{border-color:var(--fg)}
.warn{border-left:2px solid var(--red);color:var(--fg);padding:1px 0 1px 14px;font-size:12.5px;font-weight:300;line-height:1.7}
.warn-t{font-size:9px;font-weight:300;letter-spacing:.32em;text-transform:uppercase;color:var(--red);margin-bottom:7px}
.note{font-size:12.5px;font-weight:300;line-height:1.75;color:var(--fg);text-wrap:pretty}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
/* ═══ QT PizzApp ═══
   Modelo de fermento calibrado por engenharia reversa sobre o PizzApp 1.9 e
   corrigido pela literatura (Giorilli, Lauri, Hamelman, Modernist Bread).      */

// Dose direta: fermento% = A × E^(−P), E = Σ taxa(T)·h, taxa(T) = Q^(T−20).
// Ajustado a 15 medições reais do PizzApp, erro máximo 0,3%.
const FERM_A=7.327, FERM_P=1.4534, FERM_Q=1.1365;
// Poolish a 18 °C, sobre a farinha DO POOLISH. 7 medições, erro máximo 0,5%.
const POOLISH_A=3.9108, POOLISH_K=0.23089;
// Biga: 1,0% sobre a farinha da biga — padrão italiano (Giorilli, 44–45%, 18–24h a 18 °C).
const BIGA_PCT=1.0;
// Maturação da biga: 18h a 18°C (Giorilli documenta 18/24h). O poolish tem
// campo próprio de horas. Usada só para exibir o tempo real da receita.
const BIGA_H=18;
// Crédito fermentativo do pré-fermento maduro: a população de levedura
// multiplica durante a maturação, então o pré vale mais que o fermento nominal.
// Fator empírico calibrado para reproduzir a prática documentada (Zaghini/
// Consultapizza: biga 20-40% + massa final 4-6h → rinfresco zero; teto de
// 0,1% de starter em massas finais longas).
const PRE_CREDIT=2;
const LS='qtpizzapp_v2';

// ── Nuvem (Supabase) ──
// Chave publicável: própria para uso no navegador; o acesso é limitado por RLS
// à tabela de receitas do PizzApp.
const SB_URL='https://helinoirdizwrluydkzp.supabase.co/rest/v1/pizzapp_receitas';
const SB_KEY='sb_publishable_ZTaUCZHHk57mDiGEjNyKLg_8qYNFvUg';
const SB_HEAD={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};
// Identidade do aparelho: gerada uma vez, vive no localStorage.
let DEV='';
try{DEV=localStorage.getItem('qtpizzapp_dev')||'';
  if(!DEV){DEV=crypto.randomUUID();localStorage.setItem('qtpizzapp_dev',DEV);}}catch(e){DEV=crypto.randomUUID();}

const rate=t=>Math.pow(FERM_Q,Math.max(2,Math.min(35,t))-20);
const poolishPct=h=>POOLISH_A*Math.exp(-POOLISH_K*Math.max(1,Math.min(24,h)));

// Ponto de partida de uma receita nova: massa direta de 24h, neutra.
const DEFAULT={bolas:6,pbola:260,hidra:65,sal:3,malte:0,azeite:0,perda:3,tipo:'fresco',pre:'nenhum',prePct:50,poolishH:12,ctrl:true,tAmb:20,hAmb:2,tCtrl:4,hCtrl:22};
// Receita salva antes do botão de geladeira não tem o campo: sem ele, vale usar.
const usaCtrl=p=>p.ctrl!==false;
let S={view:'lib',step:0,dark:false,nome:'Nova receita',p:{...DEFAULT},recipes:[],
  aluno:'',turma:'',pendDel:[],sync:'',
  copied:false,saved:false,wMode:'unica',wSingle:330,blend:[{pct:70,w:340},{pct:30,w:300}],
  bassBase:65,bassFinal:75,edit:null};

/* ── CÁLCULO ── */
function calc(){
  const p=S.p;
  const hCtrl = usaCtrl(p) ? p.hCtrl : 0;
  const E=rate(p.tAmb)*p.hAmb + rate(p.tCtrl)*hCtrl;
  let direta = E>0 ? FERM_A*Math.pow(E,-FERM_P) : 5;
  direta = Math.max(0.005, Math.min(5, direta));

  // O pré-fermento tem sua própria dose; o refresco completa só o que a
  // maturação não cobre. Dois ajustes sobre a dose direta: (1) ela é orçada
  // apenas sobre a fração de farinha que NÃO está no pré — a farinha do pré
  // chega madura ao impasto finale e não precisa de novo orçamento; (2) o pré
  // maduro é creditado a PRE_CREDIT × o fermento nominal.
  let prePctF=0, refPctF=0, totalPct=direta, dosePre=0;
  if(p.pre!=='nenhum'){
    dosePre = p.pre==='poolish' ? poolishPct(p.poolishH) : BIGA_PCT;
    prePctF = (p.prePct/100)*dosePre;
    refPctF = Math.max(0, direta*(1-p.prePct/100) - PRE_CREDIT*prePctF);
    totalPct = prePctF + refPctF;
  }
  // conversão de tipo mantendo a proporção da divisão
  const cv = p.tipo==='seco' ? 1/3 : p.tipo==='natural' ? 10 : 1;
  const lev=+(totalPct*cv).toPrecision(3);
  const levPre=prePctF*cv, levRef=refPctF*cv;

  const soma=1+p.hidra/100+p.sal/100+lev/100+p.malte/100+p.azeite/100;
  const mf=1+(p.perda||0)/100;
  const far=p.bolas*p.pbola*mf/soma;
  const agua=far*p.hidra/100, salg=far*p.sal/100, levg=far*lev/100;
  const maltg=far*p.malte/100, azg=far*p.azeite/100;
  const total=far+agua+salg+levg+maltg+azg;

  const HP = p.pre==='poolish'?1:0.45;
  const fb = p.pre!=='nenhum' ? far*p.prePct/100 : 0;
  const ab = fb*HP, levb = far*levPre/100, levr = far*levRef/100;
  const horasPre = p.pre==='nenhum' ? 0 : (p.pre==='poolish' ? p.poolishH : BIGA_H);
  return {far,agua,salg,levg,maltg,azg,lev,total,horas:p.hAmb+hCtrl,
    horasPre, horasReal:horasPre+p.hAmb+hCtrl,
    fb,ab,levb,fr:far-fb,ar:agua-ab,levr,direta,dosePre,prePctF,
    excesso: direta>0 ? PRE_CREDIT*prePctF/direta : 0};
}

/* ── FORMATAÇÃO pt-BR ── */
const n=(v,d)=>v.toFixed(d).replace('.',',');
const g=v=>v>=1000?Math.round(v).toLocaleString('pt-BR'):v>=100?String(Math.round(v)):v>=10?n(v,1):n(v,2);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ── PERSISTÊNCIA ── */
function save(){try{localStorage.setItem(LS,JSON.stringify({recipes:S.recipes,dark:S.dark,last:S.p,nome:S.nome,
  aluno:S.aluno,turma:S.turma,pendDel:S.pendDel}));}catch(e){}}
function load(){try{const r=JSON.parse(localStorage.getItem(LS)||'null');if(!r)return;
  if(Array.isArray(r.recipes))S.recipes=r.recipes;
  if(typeof r.dark==='boolean')S.dark=r.dark;
  if(r.last)S.p={...DEFAULT,...r.last};
  if(r.nome)S.nome=r.nome;
  if(typeof r.aluno==='string')S.aluno=r.aluno;
  if(typeof r.turma==='string')S.turma=r.turma;
  if(Array.isArray(r.pendDel))S.pendDel=r.pendDel;}catch(e){}}

/* ── NUVEM ── */
// Local primeiro: o localStorage é a fonte da verdade do aparelho; a nuvem é
// espelho. Toda escrita local dispara um push; sem internet, fica pendente e
// tenta de novo quando a conexão volta.
async function cloudPush(){
  // sem nada a enviar, não há o que afirmar sobre a rede — mantém o status
  if(!S.pendDel.length && !S.recipes.length)return;
  try{
    for(const nome of [...S.pendDel]){
      const r=await fetch(SB_URL+'?device_id=eq.'+DEV+'&nome=eq.'+encodeURIComponent(nome),
        {method:'DELETE',headers:SB_HEAD});
      if(!r.ok)throw 0;
      S.pendDel=S.pendDel.filter(x=>x!==nome);
    }
    if(S.recipes.length){
      const rows=S.recipes.map(r=>({device_id:DEV,aluno:S.aluno,turma:S.turma,
        nome:r.name,params:r,updated_at:new Date().toISOString()}));
      const resp=await fetch(SB_URL+'?on_conflict=device_id,nome',
        {method:'POST',headers:{...SB_HEAD,'Prefer':'resolution=merge-duplicates'},body:JSON.stringify(rows)});
      if(!resp.ok)throw 0;
    }
    S.sync='ok';
  }catch(e){S.sync='err';}
  save();render();
}
async function cloudPull(){
  try{
    const r=await fetch(SB_URL+'?device_id=eq.'+DEV+'&select=nome,params',{headers:SB_HEAD});
    if(!r.ok)throw 0;
    const rows=await r.json();
    // agrega o que só existe na nuvem (ex.: reinstalou o app); o local prevalece
    for(const row of rows){
      if(S.pendDel.includes(row.nome))continue;
      if(!S.recipes.some(x=>x.name===row.nome))S.recipes.push({...row.params,name:row.nome});
    }
    S.sync='ok';save();render();
  }catch(e){if(!S.sync)S.sync='err';render();}
}

/* ── AÇÕES ── */
const A={};
// leitura/escrita por caminho: 'p.hidra', 'wSingle', 'blend.0.pct'
const getPath=path=>path.split('.').reduce((o,k)=>o[k],S);
const setPath=(path,v)=>{const k=path.split('.'),last=k.pop();
  k.reduce((o,x)=>o[x],S)[last]=v;};
// Enquanto o campo está em edição guardamos o texto cru, para que o re-render
// não sobrescreva o que a pessoa está digitando (ex.: apagar tudo para redigitar).
const parseNum=t=>{const v=parseFloat(String(t).replace(',','.'));return isFinite(v)?v:null;};
A.go=v=>{S.view=v;S.copied=false;S.saved=false;render();document.querySelector('.ct').scrollTop=0;};
// Força W e Bassinage abrem a partir do passo 05; voltar devolve para lá.
A.back=()=>{if(S.view==='w'||S.view==='bass'){S.step=4;A.go('recipe');return;}A.go('lib');};
A.theme=()=>{S.dark=!S.dark;save();render();};
A.step=i=>{S.step=i;S.copied=false;render();document.querySelector('.ct').scrollTop=0;};
A.next=()=>A.step(Math.min(3,S.step+1));
A.open=r=>{S.p={...DEFAULT,...r};S.nome=r.name;S.view='recipe';S.step=0;S.copied=false;S.saved=false;save();render();};
A.nova=()=>{S.p={...DEFAULT};S.nome='Nova receita';S.view='recipe';S.step=0;render();};
A.setP=(k,d,min,max)=>{S.edit=null;S.p[k]=Math.max(min,Math.min(max,+(S.p[k]+d).toFixed(2)));S.copied=false;S.saved=false;save();render();};
A.setV=(k,v)=>{S.p[k]=v;S.copied=false;S.saved=false;save();render();};
A.num=(k,d,min,max)=>{S.edit=null;S[k]=Math.max(min,Math.min(max,+(S[k]+d).toFixed(2)));render();};
A.st=(k,v)=>{S[k]=v;render();};
// Os botões segmentados chamam o manipulador com um argumento só.
A.tipo=v=>A.setV('tipo',v);
A.pre=v=>A.setV('pre',v);
A.wMode=v=>A.st('wMode',v);
A.ctrl=v=>A.setV('ctrl',v==='sim');
A.nome=e=>{S.nome=e.target.value;S.saved=false;};
A.salvar=()=>{const nome=(S.nome||'Sem nome').trim();
  S.recipes=S.recipes.filter(r=>r.name!==nome).concat([{...S.p,name:nome}]);
  S.pendDel=S.pendDel.filter(x=>x!==nome);
  S.saved=true;save();render();cloudPush();setTimeout(()=>{S.saved=false;render();},1800);};
A.del=nome=>{S.recipes=S.recipes.filter(r=>r.name!==nome);
  if(!S.pendDel.includes(nome))S.pendDel.push(nome);
  save();render();cloudPush();};
A.id=(k,v)=>{S[k]=v.trim();save();render();cloudPush();};
A.blendPct=(i,d)=>{S.edit=null;S.blend[i].pct=Math.max(0,Math.min(100,S.blend[i].pct+d));render();};
A.blendW=(i,d)=>{S.edit=null;S.blend[i].w=Math.max(100,Math.min(500,S.blend[i].w+d));render();};
A.addBlend=()=>{if(S.blend.length<5){S.blend.push({pct:0,w:300});render();}};

A.edIn=(fk,path,min,max,dec,ev)=>{
  const raw=ev.target.value;
  S.edit={fk,raw};
  const v=parseNum(raw);
  // enquanto digita não aplica o mínimo (senão "7" viraria 50 antes de virar "75")
  if(v!==null)setPath(path,Math.max(0,Math.min(max,v)));
  S.copied=false;S.saved=false;render();
};
A.edOut=(fk,path,min,max,dec,ev)=>{
  const v=parseNum(ev.target.value);
  setPath(path, v===null?getPath(path):Math.max(min,Math.min(max,+v.toFixed(dec))));
  S.edit=null;save();render();
};
A.copiar=()=>{
  const c=calc(),p=S.p;
  const L=['QT PizzApp — '+S.nome,'',
    'Farinha '+g(c.far)+' g','Água '+g(c.agua)+' g ('+n(p.hidra,1)+'%)','Sal '+g(c.salg)+' g'];
  if(p.malte>0)L.push('Malte '+g(c.maltg)+' g');
  if(p.azeite>0)L.push('Azeite '+g(c.azg)+' g');
  L.push('Fermento '+g(c.levg)+' g ('+n(c.lev,3)+'% · '+({fresco:'fresco',seco:'seco ativo',natural:'levain'})[p.tipo]+')');
  L.push('Massa total '+g(c.total)+' g');
  if(p.perda>0)L.push('Margem de perda '+n(p.perda,1)+'%');
  L.push(p.bolas+' bolas de '+n(p.pbola,0)+' g','',
    'FERMENTAÇÃO — '+n(c.horasReal,0)+'h no total',
    '  '+n(p.hAmb,0)+'h a '+p.tAmb+' °C (ambiente)');
  if(usaCtrl(p))L.push('  '+n(p.hCtrl,0)+'h a '+p.tCtrl+' °C (geladeira)');
  if(p.pre!=='nenhum'){
    L.push('',(p.pre==='biga'?'BIGA':'POOLISH')+' — '+n(p.prePct,0)+'% da farinha'
      +(p.pre==='poolish'?' · '+n(p.poolishH,0)+'h a 18 °C':''));
    L.push('  '+n(c.horasPre,0)+'h a 18 °C · Farinha '+g(c.fb)+' g · Água '+g(c.ab)+' g · Fermento '+g(c.levb)+' g');
    L.push('  Impasto finale → Farinha '+g(c.fr)+' g · Água '+g(c.ar)+' g · Sal '+g(c.salg)+' g'
      +(c.levr>0.005?' · Fermento '+g(c.levr)+' g':' · sem fermento'));
  }
  const txt=L.join('\n');
  const done=()=>{S.copied=true;render();setTimeout(()=>{S.copied=false;render();},1800);};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done).catch(()=>fb(txt,done));
  else fb(txt,done);
  function fb(t,cb){const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;top:-9999px';
    document.body.appendChild(a);a.select();try{document.execCommand('copy');cb();}catch(e){}document.body.removeChild(a);}
};

function wInfo(W){
  if(W<180)return['Farinha muito fraca. Uso restrito a baixa hidratação e fermentação curta.','55–62%','Máximo 4–6h em ambiente. Sem retardo.'];
  if(W<240)return['Farinha fraca. Boa extensibilidade, pouca elasticidade.','58–65%','6–12h, sem retardo prolongado.'];
  if(W<300)return['Farinha média. Versátil — napolitana clássica e pão.','63–72%','12–24h. Suporta retardo curto de 12–18h a 4 °C.'];
  if(W<360)return['Farinha forte. Fermentação longa e biga.','70–80%','24–48h. Ideal com biga ou retardo de 24–48h a 4 °C.'];
  if(W<420)return['Farinha muito forte. Fermentações ultra-longas, biga obrigatória.','75–85%','48–72h ou mais. Cold retard de 48h+.'];
  return['Farinha especial. Use em blend com farinhas médias para equilibrar.','Em blend. Pura fica difícil de abrir.','Longa, sempre em blend.'];
}
const curW=()=>{if(S.wMode==='unica')return S.wSingle;
  let t=0,sw=0;S.blend.forEach(b=>{t+=b.pct;sw+=b.pct*b.w;});return t>0?sw/t:0;};

/* ── COMPONENTES ── */
// ed = [caminho, min, max, casas] torna o valor digitável
const stepper=(lb,val,unit,dec,inc,sm,ed)=>{
  let mid;
  if(ed){
    const fk=ed[0];
    const shown=(S.edit&&S.edit.fk===fk)?S.edit.raw:val;
    mid=`<input class="st-n st-i" inputmode="decimal" enterkeyhint="done" data-fk="${fk}"
      value="${esc(shown)}" style="width:${Math.max(1.6,String(shown).length*0.72)}em"
      onfocus="this.select()" onkeydown="if(event.key==='Enter')this.blur()"
      oninput="A.edIn('${fk}','${ed[0]}',${ed[1]},${ed[2]},${ed[3]},event)"
      onblur="A.edOut('${fk}','${ed[0]}',${ed[1]},${ed[2]},${ed[3]},event)">`;
  } else mid=`<span class="st-n">${val}</span>`;
  return `<div>${lb?`<div class="st-lb">${lb}</div>`:''}<div class="st${sm?' sm':''}">
   <button class="st-b" onclick="${dec}" aria-label="menos">−</button>
   <div class="st-v">${mid}${unit?`<span class="st-u">${unit}</span>`:''}</div>
   <button class="st-b" onclick="${inc}" aria-label="mais">+</button></div></div>`;};
const segmented=(opts,cur,fn,cols)=>
 `<div class="sg" style="grid-template-columns:repeat(${cols||opts.length},1fr)">
   ${opts.map(o=>`<button class="sg-b${cur===o[1]?' on':''}" onclick="${fn}('${o[1]}')">${o[0]}</button>`).join('')}</div>`;
const rows=list=>list.map(r=>`<div class="rw"><span class="rw-k">${r.k}</span><span class="rw-v">${r.v}</span></div>`).join('');
const outGrid=(cells,small,cols)=>`<div class="og"${cols?` style="grid-template-columns:repeat(${cols},1fr)"`:''}>${cells.map(c=>
 `<div class="oc"><div class="oc-n"${small?' style="font-size:17px"':''}>${c.v}${c.u?`<span class="oc-u">${c.u}</span>`:''}</div><div class="oc-l">${c.l}</div></div>`).join('')}</div>`;
const item=(nome,meta,onOpen,onDel,num)=>
 `<div class="it">${num?`<div class="it-x">${num}</div>`:''}<button class="it-m" onclick="${onOpen}"><div class="it-n">${esc(nome)}</div><div class="it-d">${meta}</div></button>
  ${onDel?`<button class="it-a bd" onclick="${onDel}" aria-label="apagar">×</button>`:'<div class="it-a">→</div>'}</div>`;
const secTitle=(ov,disp,sub)=>`<div class="sec">${ov?`<div class="ov">${ov}</div>`:''}<div class="sec-d">${disp}</div>${sub?`<div class="sec-s">${sub}</div>`:''}<div class="sec-h"></div></div>`;
const metaTxt=r=>{const hp=r.pre==='nenhum'?0:(r.pre==='poolish'?(r.poolishH||12):BIGA_H);
  const h=(r.hAmb||0)+(usaCtrl(r)?(r.hCtrl||0):0)+hp;
  return r.bolas+' × '+n(r.pbola,0)+' g · '+n(r.hidra,0)+'% · '+n(h,0)+'h · '+
    (r.pre==='nenhum'?'direta':r.pre==='poolish'?'poolish':'biga');};

/* ── VIEWS ── */
function vLib(){
  const c=S.recipes.length;
  return secTitle('','Receitas','')+`
   ${c>0?`<div class="blk"><div class="ov">Suas receitas</div>
     ${S.recipes.map((r,i)=>item(r.name,metaTxt(r),`A.open(S.recipes[${i}])`,`A.del('${esc(r.name).replace(/'/g,"\\'")}')`)).join('')}</div>`
    :''}
   <div class="blk">
    <div class="g2"><input class="nm" value="${esc(S.aluno)}" placeholder="Nome"
      onchange="A.id('aluno',this.value)" aria-label="Seu nome">
    <input class="nm" value="${esc(S.turma)}" placeholder="Sobrenome"
      onchange="A.id('turma',this.value)" aria-label="Turma"></div></div>`;
}

function vStep0(){
  const p=S.p;
  return secTitle('','Massa','')
   +stepper('Nº de bolas',p.bolas,'un',"A.setP('bolas',-1,1,60)","A.setP('bolas',1,1,60)",0,['p.bolas',1,60,0])
   +stepper('Peso por bola',n(p.pbola,0),'g',"A.setP('pbola',-5,150,600)","A.setP('pbola',5,150,600)",0,['p.pbola',150,600,0])
   +stepper('Margem de perda',n(p.perda,1),'%',"A.setP('perda',-0.5,0,15)","A.setP('perda',0.5,0,15)",0,['p.perda',0,15,1]);
}

function vStep1(){
  const p=S.p,c=calc();
  const pos=Math.max(0,Math.min(100,(p.hidra-55)/30*100));
  return secTitle('','Água','')
   +stepper('Hidratação',n(p.hidra,1),'%',"A.setP('hidra',-0.5,50,90)","A.setP('hidra',0.5,50,90)",0,['p.hidra',50,90,1])
   +stepper('Sal',n(p.sal,1),'%',"A.setP('sal',-0.1,0,5)","A.setP('sal',0.1,0,5)",0,['p.sal',0,5,1])
   +`<div><div class="rl"><div class="rl-m" style="left:${pos}%"></div></div>
     <div class="rl-s"><span>55</span><span>62</span><span>70</span><span>77</span><span>85</span></div></div>`
   +`<div class="g2">${stepper('Malte',n(p.malte,1),'%',"A.setP('malte',-0.1,0,5)","A.setP('malte',0.1,0,5)",1,['p.malte',0,5,1])}
     ${stepper('Azeite',n(p.azeite,1),'%',"A.setP('azeite',-0.1,0,10)","A.setP('azeite',0.1,0,10)",1,['p.azeite',0,10,1])}</div>`;
}

function vStep2(){
  const p=S.p,c=calc();
  const hasPre=p.pre!=='nenhum';
  const preName=p.pre==='poolish'?'Poolish':'Biga';
  let extra='';
  if(hasPre){
    extra+=stepper('% da farinha na '+preName,n(p.prePct,1),'%',"A.setP('prePct',-1,5,95)","A.setP('prePct',1,5,95)",0,['p.prePct',5,95,1]);
    if(p.pre==='poolish')
      extra+=stepper('Fermentação do poolish (18 °C)',n(p.poolishH,1),'h',"A.setP('poolishH',-0.5,1,24)","A.setP('poolishH',0.5,1,24)",0,['p.poolishH',1,24,1]);
  }
  return secTitle('','Fermento','')
   +`<div class="blk"><div class="st-lb">Tipo</div>${segmented([['Fresco','fresco'],['Seco','seco'],['Levain','natural']],p.tipo,"A.tipo")}</div>`
   +`<div class="blk"><div class="st-lb">Pré-fermento</div>${segmented([['Sem','nenhum'],['Biga','biga'],['Poolish','poolish']],p.pre,"A.pre")}</div>`
   +`<div class="g2">
      ${stepper('Temperatura Ambiente',n(p.tAmb,0),'',"A.setP('tAmb',-1,2,35)","A.setP('tAmb',1,2,35)",1,['p.tAmb',2,35,0])}
      ${stepper('Horas Ambiente',n(p.hAmb,1),'',"A.setP('hAmb',-0.5,0,72)","A.setP('hAmb',0.5,0,72)",1,['p.hAmb',0,72,1])}</div>`
   +`<div class="blk"><div class="st-lb">Temperatura controlada</div>
      ${segmented([['Não','nao'],['Sim','sim']],usaCtrl(p)?'sim':'nao',"A.ctrl")}</div>`
   +(usaCtrl(p)?`<div class="g2">
      ${stepper('Temperatura Geladeira',n(p.tCtrl,0),'',"A.setP('tCtrl',-1,2,20)","A.setP('tCtrl',1,2,20)",1,['p.tCtrl',2,20,0])}
      ${stepper('Horas Geladeira',n(p.hCtrl,1),'',"A.setP('hCtrl',-0.5,0,72)","A.setP('hCtrl',0.5,0,72)",1,['p.hCtrl',0,72,1])}</div>`:'')
   +extra
   +`<div class="dz"><div class="ov">Fermento total</div>
      <div><span class="dz-n">${g(c.levg)}</span><span class="dz-u">g</span></div></div>`;
}

function vStep3(){
  const p=S.p,c=calc();
  const cells=[{v:g(c.far),u:'g',l:'Farinha'},{v:g(c.agua),u:'g',l:'Água'},
               {v:g(c.salg),u:'g',l:'Sal'},{v:g(c.levg),u:'g',l:'Fermento'}];
  let out=secTitle('','Ficha','')+outGrid(cells);
  const ex=[];
  if(p.malte>0)ex.push({k:'Malte',v:g(c.maltg)+' g'});
  if(p.azeite>0)ex.push({k:'Azeite',v:g(c.azg)+' g'});
  if(ex.length)out+=`<div class="blk">${rows(ex)}</div>`;
  if(p.pre!=='nenhum'){
    const preName=p.pre==='poolish'?'Poolish':'Biga';
    out+=`<div class="blk"><div class="ov">${preName} — ${n(p.prePct,0)}% da farinha${p.pre==='poolish'?' · '+n(p.poolishH,0)+'h':''}</div>
      ${rows([{k:'Farinha '+preName,v:g(c.fb)+' g'},{k:'Água '+preName,v:g(c.ab)+' g'},
              {k:'Fermento',v:g(c.levb)+' g'},{k:'Total',v:g(c.fb+c.ab+c.levb)+' g'}])}</div>`;
    out+=`<div class="blk"><div class="ov">Impasto finale</div>
      ${rows([{k:'Farinha Final',v:g(c.fr)+' g'},{k:'Água Final',v:g(c.ar)+' g'},
              {k:'Sal',v:g(c.salg)+' g'},
              {k:'Fermento',v:c.levr>0.005?g(c.levr)+' g':'sem fermento'},
              {k:'Massa total',v:g(c.total)+' g'}])}</div>`;
  }else{
    out+=`<div class="blk"><div class="ov">Massa direta</div>
      ${rows([{k:'Fermentação',v:n(c.horas,0)+'h'},{k:'Massa total',v:g(c.total)+' g'}])}</div>`;
  }
  if(p.pre!=='nenhum')out+=`<div class="blk"><div class="ov">Tempo total</div>
    ${rows([{k:(p.pre==='poolish'?'Poolish':'Biga')+' (18 °C)',v:n(c.horasPre,0)+'h'},
            {k:'Massa final',v:n(c.horas,0)+'h'},{k:'Total',v:n(c.horasReal,0)+'h'}])}</div>`;
  out+=`<div><div class="st-lb">Nome da receita</div>
    <input class="nm" value="${esc(S.nome)}" oninput="A.nome(event)" aria-label="Nome da receita"></div>
    <div class="ac"><button class="ac-b" onclick="A.copiar()">${S.copied?'Copiado':'Copiar ficha'}</button>
    <button class="ac-b inv" onclick="A.salvar()">${S.saved?'Salva ✓':'Salvar receita'}</button></div>`;
  return out;
}

function vTools(){
  const T=[['Força W','A farinha que você tem.','w'],
    ['Bassinage','A água que entra depois.','bass']];
  return secTitle('Passo 05','Apoio','cálculos de farinha e água.')
   +`<div class="blk">${T.map((t,i)=>item(t[0],t[1],`A.go('${t[2]}')`,null,'0'+(i+1))).join('')}</div>`;
}

function vW(){
  const c=calc(),W=curW(),wi=wInfo(W);
  const tot=S.blend.reduce((a,b)=>a+b.pct,0);
  let body=`<div class="blk">${segmented([['Única','unica'],['Blend','blend']],S.wMode,"A.wMode")}</div>`;
  if(S.wMode==='unica'){
    body+=stepper('W da farinha',String(S.wSingle),'',"A.num('wSingle',-10,100,500)","A.num('wSingle',10,100,500)",0,['wSingle',100,500,0]);
  }else{
    body+=S.blend.map((b,i)=>`<div style="border:1px solid var(--hair);padding:14px 15px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px">
        <span class="ov">Farinha ${i+1}</span>
        <span class="ex" style="font-size:13px;color:var(--mid)">${tot>0?g(c.far*b.pct/tot)+' g':'—'}</span></div>
      <div class="g2">${stepper('',n(b.pct,0),'%',`A.blendPct(${i},-1)`,`A.blendPct(${i},1)`,1,['blend.'+i+'.pct',0,100,0])}
        ${stepper('',String(b.w),'W',`A.blendW(${i},-10)`,`A.blendW(${i},10)`,1,['blend.'+i+'.w',100,500,0])}</div></div>`).join('');
    const av=tot===0?['Defina as proporções','var(--mid)']:Math.abs(tot-100)<0.05?['Blend completo — 100%','var(--green)']
      :tot>100?['Total excede 100%','var(--red)']:['Falta '+n(100-tot,0)+'%','var(--mid)'];
    body+=`<div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
      <span style="font-size:11px;font-weight:300;color:${av[1]}">${av[0]}</span>
      ${S.blend.length<5?`<button class="ac-b" style="padding:12px 18px" onclick="A.addBlend()">+ Farinha</button>`:''}</div>`;
  }
  body+=`<div style="border:1px solid var(--hair);padding:18px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px">
      <span style="font-size:12px;font-weight:300;color:var(--mid)">${S.wMode==='unica'?'W da farinha':'W médio do blend'}</span>
      <span class="ex" style="font-size:34px">${W>=100?Math.round(W):'—'}</span></div>
    <div class="hair" style="margin:16px 0"></div>
    ${[['Leitura',wi[0]],['Hidratação recomendada',wi[1]]].map(x=>
      `<div style="margin-bottom:14px"><div class="ov" style="font-size:8.5px">${x[0]}</div>
       <div class="note" style="margin-top:5px">${x[1]}</div></div>`).join('')}</div>`;
  return secTitle('Ferramenta 01','Força W','a farinha que você tem.')+body;
}

function vBass(){
  const c=calc(),p=S.p;
  const far=c.far>0?c.far:1000;
  // As hidratações são sobre a farinha total. Quando há pré-fermento, parte
  // dessa água já foi para a biga/poolish na véspera: o que se pesa na masseira
  // é só o restante.
  const ehBiga=p.pre==='biga';
  const preName=ehBiga?'biga':'poolish', art=ehBiga?'a':'o';
  const aguaPre = p.pre!=='nenhum' ? c.ab : 0;
  const base=far*S.bassBase/100, af=far*S.bassFinal/100;
  const ex=af-base;
  const naMistura=Math.max(0,base-aguaPre);
  const temPre=p.pre!=='nenhum';
  // Onde cada parte da água entra: no pré-fermento, no impasto finale e depois.
  const cells=[];
  if(temPre)cells.push({v:g(aguaPre),u:'g',l:'Água n'+art+' '+preName});
  cells.push({v:naMistura>0?g(naMistura):'0',u:'g',l:temPre?'Água no impasto':'Água na mistura'});
  cells.push({v:ex>0?g(ex):'0',u:'g',l:'Água tardia'});
  const aviso = temPre&&aguaPre>=base
    ? `<div class="warn">${art.toUpperCase()} ${preName} sozinh${art} já carrega mais água do que a hidratação
       base de ${n(S.bassBase,1)}% pede. Suba a base ou reduza a % de farinha n${art} ${preName}.</div>` : '';
  return secTitle('Ferramenta 02','Bassinage','a água que entra depois.')+`
   <div class="g2">${stepper('Hidratação base',n(S.bassBase,1),'%',"A.num('bassBase',-0.5,40,90)","A.num('bassBase',0.5,40,90)",1,['bassBase',40,90,1])}
    ${stepper('Hidratação final',n(S.bassFinal,1),'%',"A.num('bassFinal',-0.5,40,95)","A.num('bassFinal',0.5,40,95)",1,['bassFinal',40,95,1])}</div>
   ${outGrid(cells,temPre,temPre?3:null)}
   ${aviso}`;
}

/* ── RENDER ── */
const TITLES={lib:'Receitas',recipe:'',w:'Força W',bass:'Bassinage'};

function render(){
  const V=S.view,p=S.p,c=calc();
  document.documentElement.setAttribute('data-theme',S.dark?'dark':'light');
  document.querySelector('meta[name="theme-color"]').setAttribute('content',S.dark?'#1A1E1E':'#EFECEC');
  const preName=p.pre==='poolish'?'poolish':'biga';
  const headT = V==='recipe'? S.nome : TITLES[V];
  const headS = V==='recipe'
    ? (p.pre==='nenhum'
        ? n(c.horas,0)+'h · direta'
        : n(c.horasReal,0)+'h · '+preName+' '+n(p.prePct,0)+'% ('+n(c.horasPre,0)+'h + '+n(c.horas,0)+'h)')
    : '';

  let body='';
  if(V==='lib')body=vLib();
  else if(V==='recipe')body=[vStep0,vStep1,vStep2,vStep3,vTools][S.step]();
  else if(V==='w')body=vW();
  else if(V==='bass')body=vBass();

  const steps = V==='recipe' ? `<div class="steps">${
    ['Massa','Água','Fermento','Ficha','Apoio'].map((l,i)=>
      `<button class="stp${S.step===i?' on':''}" onclick="A.step(${i})">
        <span class="stp-n">0${i+1}</span><span class="stp-l">${l}</span></button>`).join('')}</div>` : '';

  let footer='';
  if(V==='lib'){
    footer=`<div class="lib-ft">
      <button class="lib-b" onclick="A.nova()">Nova receita</button></div>`;
  }else if(V==='recipe'&&S.step<3){   // o fluxo termina na Ficha; Apoio é consulta
    const cells=[[g(c.far),'Farinha'],[g(c.agua),'Água'],[g(c.salg),'Sal'],[g(c.levg),'Fermento']];
    footer=`<div class="ft"><div class="ft-g">${cells.map(x=>
      `<div class="ft-c"><div class="ft-n">${x[0]}</div><div class="ft-l">${x[1]}</div></div>`).join('')}</div>
      <div class="ft-b"><span class="ft-t">${p.pre==='nenhum'?'Massa direta · '+n(c.horas,0)+'h'
        :(p.pre==='poolish'?'Poolish':'Biga')+' '+n(p.prePct,0)+'% · '+g(c.fb)+' g'}</span>
      <button class="ft-x" onclick="A.next()">Próximo →</button></div></div>`;
  }

  // O render reconstrói a tela inteira, o que zeraria a rolagem a cada toque
  // no − / +. Guarda a posição antes e devolve depois; quem quer voltar ao topo
  // (troca de tela ou de passo) zera explicitamente após chamar render().
  const antes=document.querySelector('.ct');
  const scroll=antes?antes.scrollTop:0;
  // preserva o foco e o cursor de qualquer campo em edição (nome ou stepper)
  const foco=document.activeElement;
  const eraNome=foco&&foco.classList&&foco.classList.contains('nm');
  const fkFoco=foco&&foco.dataset?foco.dataset.fk:null;
  let selIni=0,selFim=0;
  if(eraNome||fkFoco){try{selIni=foco.selectionStart;selFim=foco.selectionEnd;}catch(e){}}

  document.getElementById('app').innerHTML=
    `<header class="hd">
       ${V==='lib'?'<div style="width:36px;flex:none"></div>':`<button class="hd-btn" onclick="A.back()" aria-label="voltar">←</button>`}
       <div class="hd-mid">${headT?`<div class="hd-t">${esc(headT)}</div>`:''}${headS?`<div class="hd-s">${headS}</div>`:''}</div>
       <button class="hd-th" onclick="A.theme()" aria-label="tema">${S.dark?'CLA':'ESC'}</button>
     </header>${steps}<main class="ct">${body}</main>${footer}`;

  const agora=document.querySelector('.ct');
  if(agora&&scroll)agora.scrollTop=scroll;
  const alvo = eraNome ? document.querySelector('.nm')
             : fkFoco ? document.querySelector('[data-fk="'+fkFoco+'"]') : null;
  if(alvo){alvo.focus({preventScroll:true});try{alvo.setSelectionRange(selIni,selFim);}catch(e){}}
}

/* ── INIT ── */
load();
render();
cloudPull().then(cloudPush);
window.addEventListener('online',cloudPush);
// contexto seguro: https em produção, localhost para testar antes de publicar
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'))
  navigator.serviceWorker.register('/sw.js');
</script>
</body>
